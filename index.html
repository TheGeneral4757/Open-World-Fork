<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#06131c}
.menu{position:relative;width:100vw;height:100vh;overflow:hidden;background:#06131c url("open-world-menu.webp") center center/cover no-repeat}
.menu:after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.2) 100%)}
.hit{position:absolute;z-index:20;left:6.2%;width:min(430px,32vw);border:1px solid transparent;border-radius:8px;background:transparent;color:transparent;cursor:pointer;transition:.2s}
.hit:hover{border-color:rgba(100,245,230,.8);background:rgba(40,220,190,.08);box-shadow:0 0 25px rgba(70,240,220,.18)}
.play-hit{top:45%;height:10.5%}
.settings-hit{top:58%;height:10.5%}
.modal{display:none;position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.76);backdrop-filter:blur(8px);align-items:center;justify-content:center}
.panel{width:min(520px,86vw);padding:38px;border:1px solid #6f939c;border-radius:14px;background:linear-gradient(145deg,#0b1c28,#08131d);box-shadow:0 25px 80px rgba(0,0,0,.8);font-family:Georgia,"Times New Roman",serif;color:white}
.panel h2{font-size:36px;margin-bottom:12px;color:#f5c86b}
.panel p{font-family:Arial,sans-serif;color:#c8d4dc;line-height:1.7;margin-bottom:24px}
.close{height:50px;padding:0 28px;border:1px solid #6f939c;border-radius:7px;background:#102b35;color:white;font-size:17px;cursor:pointer}
.close:hover{background:#164b52}
@media(max-width:700px){
  .play-hit{top:42%;height:11%;left:5%;width:60vw}
  .settings-hit{top:55%;height:11%;left:5%;width:60vw}
}
</style>
</head>
<body>
<div class="menu">
  <button class="hit play-hit" aria-label="Play" onclick="startGame()"></button>
  <button class="hit settings-hit" aria-label="Settings" onclick="openSettings()"></button>

  <div class="modal" id="settings">
    <div class="panel">
      <h2>Settings</h2>
      <p>Your adventure settings will live here. More options can be added as the Open World game is built.</p>
      <button class="close" onclick="closeSettings()">CLOSE</button>
    </div>
  </div>
</div>
<script>
function startGame(){alert("The Open World game will start here!")}
function openSettings(){document.getElementById("settings").style.display="flex"}
function closeSettings(){document.getElementById("settings").style.display="none"}
</script>
</body>
</html>
