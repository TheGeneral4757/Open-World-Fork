<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#f5b94b;--cyan:#70efe4}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif;background:#07131b;color:#fff}
.menu{position:relative;width:100vw;height:100vh;overflow:hidden;background:
radial-gradient(circle at 84% 28%,rgba(255,237,181,.9) 0 2.8%,rgba(255,189,101,.38) 7%,transparent 24%),
linear-gradient(180deg,#173f61 0%,#4f86a0 27%,#d99c65 53%,#1f4d42 53.5%,#061d1b 100%)}
.menu:after{content:"";position:absolute;inset:0;z-index:60;pointer-events:none;background:
radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.4) 100%),
linear-gradient(180deg,rgba(0,0,0,.03),transparent 40%,rgba(0,0,0,.32))}
.sky{position:absolute;inset:0;z-index:1;overflow:hidden}
.sun{position:absolute;right:8.5%;top:21%;width:115px;height:115px;border-radius:50%;background:#fff5c8;box-shadow:0 0 35px #fff1b1,0 0 110px 42px rgba(255,212,121,.3)}
.cloud{position:absolute;width:300px;height:58px;border-radius:60px;background:rgba(255,255,255,.17);filter:blur(5px)}
.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud:before{width:120px;height:120px;left:40px;bottom:0}.cloud:after{width:150px;height:150px;right:30px;bottom:0}
.c1{left:-340px;top:10%;animation:drift 72s linear infinite}.c2{left:-500px;top:24%;transform:scale(.7);animation:drift 96s linear 14s infinite}.c3{left:-420px;top:7%;transform:scale(.45);animation:drift 120s linear 26s infinite}
@keyframes drift{to{left:115%}}
.mountain{position:absolute;z-index:5;bottom:29%;width:0;height:0;border-left:265px solid transparent;border-right:265px solid transparent;border-bottom:365px solid #365b6d;filter:drop-shadow(0 12px 9px rgba(0,0,0,.25))}
.m1{left:28%;bottom:32%}.m2{left:2%;bottom:29%;transform:scale(.76);border-bottom-color:#294957}.m3{left:52%;bottom:31%;transform:scale(.73);border-bottom-color:#416b79}.m4{left:71%;bottom:29%;transform:scale(.54);border-bottom-color:#264755}
.snow{position:absolute;z-index:6;left:calc(28% + 209px);bottom:calc(32% + 279px);width:0;height:0;border-left:55px solid transparent;border-right:55px solid transparent;border-bottom:84px solid #eef6f5;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))}
.mist{position:absolute;z-index:7;left:12%;right:5%;bottom:30%;height:90px;background:linear-gradient(90deg,transparent,rgba(226,241,238,.1),rgba(226,241,238,.2),transparent);filter:blur(14px)}
.terrain{position:absolute;z-index:12;left:-7%;right:-7%;bottom:-8%;height:48%;background:
radial-gradient(ellipse at 18% 22%,rgba(67,127,76,.95) 0 9%,transparent 10%),
radial-gradient(ellipse at 64% 15%,rgba(54,105,66,.8) 0 9%,transparent 10%),
radial-gradient(ellipse at 80% 32%,rgba(37,84,56,.9) 0 12%,transparent 13%),
linear-gradient(165deg,#315f3f 0%,#16392d 58%,#071a18 100%);
border-radius:50% 50% 0 0;transform:rotate(-2deg);box-shadow:inset 0 25px 45px rgba(0,0,0,.18)}
.water{position:absolute;z-index:10;right:-5%;bottom:5%;width:49%;height:29%;border-radius:55% 45% 0 45%;transform:rotate(-8deg);opacity:.95;background:
repeating-linear-gradient(172deg,rgba(255,255,255,.15) 0 2px,transparent 2px 15px),
linear-gradient(145deg,#4aaeb7,#1a6f84 55%,#083f55);box-shadow:inset 0 15px 30px rgba(118,231,229,.16)}
.river{position:absolute;z-index:13;left:43%;bottom:-3%;width:13%;height:46%;background:linear-gradient(90deg,transparent,#318f92aa,#6bd2cba6,transparent);clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);filter:blur(2px)}
.island{position:absolute;z-index:14;right:23%;bottom:18%;width:170px;height:46px;border-radius:50%;background:#694e36;transform:rotate(-6deg);box-shadow:0 8px 0 rgba(0,0,0,.2)}
.city{position:absolute;z-index:18;right:18%;bottom:29%;width:280px;height:180px;filter:drop-shadow(0 9px 8px rgba(0,0,0,.4))}
.building{position:absolute;bottom:0;background:linear-gradient(90deg,#403b38,#76695e,#49423d);border-radius:3px 3px 0 0;box-shadow:inset 6px 0 rgba(255,208,130,.1)}
.b1{left:0;width:36px;height:57px}.b2{left:44px;width:43px;height:80px}.b3{left:97px;width:39px;height:63px}.b4{left:164px;width:48px;height:95px}.b5{left:223px;width:40px;height:58px}
.building:after{content:"";position:absolute;inset:10px 7px;background:
repeating-linear-gradient(90deg,#f0c56e 0 5px,transparent 5px 15px),
repeating-linear-gradient(0deg,#f0c56e 0 5px,transparent 5px 17px);opacity:.62}
.tower{position:absolute;left:120px;bottom:0;width:40px;height:150px;background:linear-gradient(90deg,#4d4742,#807367,#47413b)}
.tower:before{content:"";position:absolute;top:-44px;left:-15px;border-left:35px solid transparent;border-right:35px solid transparent;border-bottom:47px solid #443e39}
.tower:after{content:"";position:absolute;top:34px;left:13px;width:13px;height:18px;background:#f7d073;box-shadow:0 35px #f7d073,0 70px #f7d073}
.bridge{position:absolute;z-index:17;right:28%;bottom:19%;width:220px;height:15px;border-radius:50%;background:#705239;transform:rotate(-7deg);box-shadow:0 8px 0 rgba(0,0,0,.25)}
.tree{position:absolute;z-index:22;width:42px;height:125px}
.tree:before{content:"";position:absolute;left:16px;bottom:0;width:10px;height:55px;background:#382b20}
.tree:after{content:"";position:absolute;left:-15px;top:0;width:73px;height:85px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#4b8951,#1d4d35 71%);box-shadow:19px 25px 0 -7px #295a3d,-18px 32px 0 -10px #356c45}
.t1{left:6%;bottom:22%;transform:scale(1.35)}.t2{left:18%;bottom:30%;transform:scale(.82)}.t3{left:40%;bottom:20%;transform:scale(1.08)}.t4{right:5%;bottom:24%;transform:scale(1.3)}.t5{right:35%;bottom:18%;transform:scale(.7)}
.hero{position:absolute;z-index:29;left:34%;bottom:10%;width:78px;height:178px;filter:drop-shadow(0 13px 9px rgba(0,0,0,.6))}
.hero .cape{position:absolute;top:48px;left:-10px;width:68px;height:101px;background:linear-gradient(115deg,#0a1117,#2a343d);clip-path:polygon(18% 0,82% 0,100% 100%,48% 78%,0 100%);transform:rotate(-4deg)}
.hero .hood{position:absolute;top:-5px;left:14px;width:51px;height:45px;border-radius:55% 55% 35% 35%;background:#10181e;z-index:-1}
.hero .head{position:absolute;top:3px;left:22px;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4a3425,#171210)}
.hero .body{position:absolute;top:32px;left:15px;width:46px;height:74px;border-radius:12px 12px 5px 5px;background:linear-gradient(90deg,#11181d,#37434d,#10161b);border:1px solid #596770}
.hero .leg1,.hero .leg2{position:absolute;top:99px;width:19px;height:68px;background:#11171b;border-radius:6px}.hero .leg1{left:16px;transform:rotate(7deg)}.hero .leg2{left:41px;transform:rotate(-7deg)}
.hero .sword{position:absolute;top:34px;right:-18px;width:7px;height:94px;background:linear-gradient(90deg,#aab9ba,#fff,#738386);transform:rotate(24deg);border-radius:4px;box-shadow:0 0 6px #fff}
.hero .sword:after{content:"";position:absolute;bottom:-7px;left:-7px;width:21px;height:7px;background:#9f7137}
.firefly{position:absolute;z-index:25;width:4px;height:4px;border-radius:50%;background:#fff1a0;box-shadow:0 0 12px 4px #ffe374;animation:float 4s ease-in-out infinite}
.f1{left:23%;bottom:29%}.f2{left:31%;bottom:19%;animation-delay:1s}.f3{left:46%;bottom:27%;animation-delay:2s}.f4{right:31%;bottom:22%;animation-delay:.5s}
@keyframes float{50%{transform:translate(12px,-18px);opacity:.3}}
.logo{position:absolute;z-index:80;top:5.5%;left:5.5%;font-weight:900;font-size:clamp(52px,6.3vw,108px);line-height:.72;letter-spacing:-5px;text-shadow:5px 7px 0 #17212a,0 12px 34px rgba(0,0,0,.72)}
.logo .world{display:block;color:var(--gold);text-shadow:5px 7px 0 #4a3212,0 10px 28px rgba(0,0,0,.7)}
.logo small{display:block;font-size:.18em;line-height:1;letter-spacing:8px;margin:14px 0 0 9px;color:#e1e9e7;text-shadow:2px 2px #111b21}
.tagline{position:absolute;z-index:80;top:5%;right:5%;font-size:clamp(13px,1.35vw,21px);letter-spacing:4px;color:#f7f0df;text-shadow:0 2px 8px #111}
.tagline:after{content:"";display:block;height:1px;margin-top:12px;background:linear-gradient(90deg,transparent,#fff,transparent)}
.menu-buttons{position:absolute;z-index:80;left:5.5%;top:43%;width:min(410px,33vw)}
button.menu-btn{width:100%;height:76px;margin-bottom:16px;border:1px solid #77858f;border-radius:8px;color:#fff;font:700 25px Georgia,"Times New Roman",serif;letter-spacing:2px;text-align:left;padding:0 30px;cursor:pointer;background:linear-gradient(110deg,rgba(5,16,25,.94),rgba(16,35,47,.78));box-shadow:0 12px 28px rgba(0,0,0,.4),inset 0 1px rgba(255,255,255,.12);transition:.22s}
button.menu-btn:hover{transform:translateX(9px);border-color:#a7fff4;box-shadow:0 0 24px rgba(112,239,228,.25),0 12px 28px rgba(0,0,0,.45)}
button.play{background:linear-gradient(110deg,#075c49,#0d806b,#123f3c);border-color:var(--cyan);box-shadow:0 0 26px rgba(112,239,228,.25),0 12px 28px rgba(0,0,0,.4)}
.icon{display:inline-flex;width:34px;justify-content:center;margin-right:13px;color:#e0fff9}
.sub{display:block;margin:3px 0 0 47px;font:400 10px Arial,sans-serif;letter-spacing:2px;color:#bdd0d4}
.bottom-info{position:absolute;z-index:80;left:5.5%;bottom:5%;font-size:13px;letter-spacing:3px;color:#e1e8e5;text-shadow:0 2px 5px #111}
.bottom-info:before{content:"";display:inline-block;width:75px;height:1px;margin-right:12px;vertical-align:middle;background:#dce6e2}
.compass{position:absolute;z-index:80;right:4%;bottom:5%;width:92px;height:92px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(5,15,21,.3);box-shadow:inset 0 0 20px rgba(255,255,255,.06)}
.compass:before{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.25);border-radius:50%}
.compass:after{content:"N";position:absolute;top:2px;left:41px;font:bold 12px Arial;color:#fff}
.needle{position:absolute;left:43px;top:18px;width:6px;height:57px;background:linear-gradient(#f5b94b 0 50%,#e5eeee 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:rotate(28deg)}
.modal{display:none;position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);align-items:center;justify-content:center}
.panel{width:min(520px,86vw);padding:38px;border:1px solid #6f939c;border-radius:14px;background:linear-gradient(145deg,#0b1c28,#08131d);box-shadow:0 25px 80px rgba(0,0,0,.8);color:#fff}
.panel h2{font-size:36px;margin-bottom:12px;color:#f5c86b}
.panel p{font-family:Arial,sans-serif;color:#c8d4dc;line-height:1.7;margin-bottom:24px}
.close{height:50px;padding:0 28px;border:1px solid #6f939c;border-radius:7px;background:#102b35;color:#fff;font-size:17px;cursor:pointer}
.close:hover{background:#164b52}
@media(max-width:700px){
.logo{top:4%;left:5%;font-size:52px}
.tagline{display:none}
.menu-buttons{left:5%;top:40%;width:60vw}
button.menu-btn{height:63px;font-size:19px}
.hero{left:48%;transform:scale(.75)}
.city{right:2%;transform:scale(.7);transform-origin:bottom right}
.compass{display:none}
}
</style>
</head>
<body>
<div class="menu">
  <div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
  <div class="mountain m1"></div><div class="mountain m2"></div><div class="mountain m3"></div><div class="mountain m4"></div><div class="snow"></div><div class="mist"></div>
  <div class="water"></div><div class="river"></div><div class="island"></div><div class="terrain"></div>
  <div class="city"><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="tower"></div><div class="building b4"></div><div class="building b5"></div></div>
  <div class="bridge"></div>
  <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="tree t5"></div>
  <div class="firefly f1"></div><div class="firefly f2"></div><div class="firefly f3"></div><div class="firefly f4"></div>
  <div class="hero"><div class="hood"></div><div class="head"></div><div class="body"></div><div class="cape"></div><div class="leg1"></div><div class="leg2"></div><div class="sword"></div></div>

  <div class="logo">OPEN<span class="world">WORLD</span><small>AN UNFORGETTABLE ADVENTURE</small></div>
  <div class="tagline">EXPLORE &nbsp; • &nbsp; BUILD &nbsp; • &nbsp; SURVIVE</div>

  <div class="menu-buttons">
    <button class="menu-btn play" onclick="startGame()"><span class="icon">▶</span> PLAY<div class="sub">ENTER THE WORLD</div></button>
    <button class="menu-btn" onclick="openSettings()"><span class="icon">⚙</span> SETTINGS<div class="sub">CUSTOMIZE YOUR EXPERIENCE</div></button>
  </div>

  <div class="bottom-info">A VAST WORLD AWAITS...</div>
  <div class="compass"><div class="needle"></div></div>

  <div class="modal" id="settings">
    <div class="panel">
      <h2>Settings</h2>
      <p>Your adventure settings will live here. More options can be added as the Open World game is built.</p>
      <button class="close" onclick="closeSettings()">CLOSE</button>
    </div>
  </div>
</div>
<script>
function startGame(){alert("The Open World game will start here!")}
function openSettings(){document.getElementById("settings").style.display="flex"}
function closeSettings(){document.getElementById("settings").style.display="none"}
</script>
</body>
</html>
