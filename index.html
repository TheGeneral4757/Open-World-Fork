<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08141d}
body{font-family:Georgia,"Times New Roman",serif}
.screen{position:relative;width:100vw;height:100vh;overflow:hidden;background:#08141d}
.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.hit{position:absolute;z-index:10;border:0;background:transparent;cursor:pointer}
.hit:hover{background:rgba(80,240,220,.08);box-shadow:0 0 28px rgba(80,240,220,.22)}
.play{left:5.5%;top:45.8%;width:min(430px,33vw);height:10%}
.settings{left:5.5%;top:59%;width:min(430px,33vw);height:10%}
.modal{display:none;position:absolute;inset:0;z-index:30;align-items:center;justify-content:center;background:rgba(0,0,0,.78);backdrop-filter:blur(8px)}
.panel{width:min(520px,86vw);padding:38px;border:1px solid #7897a0;border-radius:14px;background:linear-gradient(145deg,#0b1d29,#08131d);box-shadow:0 25px 80px rgba(0,0,0,.82);color:#fff}
.panel h2{margin:0 0 12px;color:#f5cc74;font-size:36px}
.panel p{margin:0 0 24px;font:400 16px/1.7 Arial,sans-serif;color:#cbd7dc}
.close{padding:11px 25px;border:1px solid #73929b;border-radius:7px;background:#14323c;color:white;cursor:pointer;font-size:16px}
@media(max-width:700px){.play{left:5%;top:42%;width:60vw}.settings{left:5%;top:56%;width:60vw}}
</style>
</head>
<body>
<div class="screen">
  <img class="hero-image" src="assets/home-screen.webp" alt="Open World cinematic home screen">
  <button class="hit play" aria-label="Play" onclick="startGame()"></button>
  <button class="hit settings" aria-label="Settings" onclick="openSettings()"></button>
  <div class="modal" id="settings">
    <div class="panel">
      <h2>Settings</h2>
      <p>Your adventure settings will live here as the game is built.</p>
      <button class="close" onclick="closeSettings()">CLOSE</button>
    </div>
  </div>
</div>
<script>
function startGame(){alert("The Open World game will start here!")}
function openSettings(){document.getElementById("settings").style.display="flex"}
function closeSettings(){document.getElementById("settings").style.display="none"}
</script>
</body>
</html>
