<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Open World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131a}
body{font-family:Georgia,"Times New Roman",serif;color:#fff}.menu{position:relative;width:100vw;height:100vh;overflow:hidden;background:#07131a}
.scene{position:absolute;inset:0;width:100%;height:100%}.ui{position:absolute;inset:0;z-index:20;pointer-events:none}
.logo{position:absolute;left:5.5%;top:6.3%;font-weight:900;font-size:clamp(54px,6.3vw,110px);line-height:.72;letter-spacing:-5px;color:#fafaf4;text-shadow:5px 7px 0 #16212a,0 13px 35px #000b}
.logo span{display:block;color:#f3b442;text-shadow:5px 7px 0 #4b3011,0 10px 30px #0009}
.logo small{display:block;margin:16px 0 0 9px;font-size:.18em;letter-spacing:8px;color:#eef2ed;text-shadow:2px 2px #16212a}
.topline{position:absolute;right:5%;top:5%;font-size:clamp(13px,1.4vw,22px);letter-spacing:4px;text-shadow:0 2px 10px #000a}.topline:after{content:"";display:block;height:1px;margin-top:13px;background:linear-gradient(90deg,transparent,#fff,transparent)}
.controls{position:absolute;left:5.5%;top:45%;width:min(430px,33vw);pointer-events:auto}.btn{display:block;width:100%;height:84px;margin-bottom:18px;border:1px solid #c7ecea;border-radius:10px;color:white;text-align:left;padding:10px 28px;background:linear-gradient(110deg,#045b49f2,#154d4699);box-shadow:0 13px 36px #0006,inset 0 1px #ffffff33;cursor:pointer;transition:.2s;font:700 27px Georgia,"Times New Roman",serif;letter-spacing:2px}.btn.settings{background:linear-gradient(110deg,#050f17f2,#12202acc);border-color:#b5c0c6d9}.btn:hover{transform:translateX(8px);box-shadow:0 0 32px #70efe43b,0 16px 40px #0007;border-color:#c8fff9}.sub{display:block;margin:4px 0 0 46px;font:400 10px Arial,sans-serif;letter-spacing:3px;color:#d3dfde}.icon{display:inline-flex;width:38px;justify-content:center;margin-right:8px;font-family:Arial,sans-serif}
.bottom{position:absolute;left:5.5%;bottom:5.2%;font-size:14px;letter-spacing:3px;text-shadow:0 2px 7px #000}.bottom:before{content:"";display:inline-block;width:75px;height:1px;margin-right:13px;vertical-align:middle;background:#e9efed}
.compass{position:absolute;right:4.2%;bottom:5%;width:96px;height:96px;border:1px solid #fff8;border-radius:50%;background:#040e153f;box-shadow:inset 0 0 25px #fff1}.compass:before{content:"";position:absolute;inset:9px;border:1px solid #fff4;border-radius:50%}.compass i{position:absolute;font:700 12px Arial;font-style:normal}.n{top:2px;left:45px}.s{bottom:2px;left:46px}.e{right:2px;top:42px}.w{left:2px;top:42px}.needle{position:absolute;left:45px;top:20px;width:7px;height:56px;background:linear-gradient(#f4b545 0 50%,#e9eeee 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:rotate(28deg)}
.modal{display:none;position:absolute;z-index:100;inset:0;align-items:center;justify-content:center;background:#000c;backdrop-filter:blur(8px)}.panel{width:min(520px,86vw);padding:38px;border:1px solid #7897a0;border-radius:14px;background:linear-gradient(145deg,#0b1d29,#08131d);box-shadow:0 25px 80px #000d}.panel h2{margin:0 0 12px;color:#f5cc74;font-size:36px}.panel p{margin:0 0 24px;font:400 16px/1.7 Arial;color:#cbd7dc}.close{padding:11px 25px;border:1px solid #73929b;border-radius:7px;background:#14323c;color:white;cursor:pointer;font-size:16px}
@media(max-width:700px){.logo{top:5%;left:5%;font-size:52px}.topline{display:none}.controls{left:5%;top:40%;width:60vw}.btn{height:66px;font-size:19px}.compass{display:none}.bottom{font-size:11px}}
</style></head>
