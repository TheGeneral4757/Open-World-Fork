<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071522}
body{font-family:Georgia,"Times New Roman",serif;color:#fff}
.menu{position:relative;width:100vw;height:100vh;overflow:hidden;background:#071522}
.scene{position:absolute;inset:0;width:100%;height:100%}
.ui{position:absolute;inset:0;z-index:10;pointer-events:none}
.logo{position:absolute;left:5.5%;top:7%;color:#fff;font-size:clamp(52px,6.2vw,108px);font-weight:900;line-height:.78;letter-spacing:-5px;text-shadow:5px 7px 0 #121b22,0 12px 35px rgba(0,0,0,.7)}
.logo .gold{display:block;color:#f4b43f;text-shadow:5px 7px 0 #4a3011,0 10px 30px rgba(0,0,0,.65)}
.logo small{display:block;margin:14px 0 0 8px;font-size:.18em;letter-spacing:8px;line-height:1;color:#edf2ee;text-shadow:2px 2px #182029}
.topline{position:absolute;right:5.2%;top:5.2%;font-size:clamp(13px,1.4vw,22px);letter-spacing:4px;text-shadow:0 2px 9px #111}
.topline:after{content:"";display:block;width:100%;height:1px;margin-top:14px;background:linear-gradient(90deg,transparent,#fff,transparent)}
.controls{position:absolute;left:5.5%;top:46%;width:min(430px,33vw);pointer-events:auto}
.menu-btn{position:relative;width:100%;height:84px;margin-bottom:18px;border:2px solid rgba(190,231,235,.9);border-radius:10px;color:#fff;text-align:left;padding:10px 28px;font:700 27px Georgia,"Times New Roman",serif;letter-spacing:2px;cursor:pointer;background:linear-gradient(100deg,rgba(4,73,66,.94),rgba(16,83,78,.54));box-shadow:0 10px 35px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.18);transition:.2s}
.menu-btn.settings{background:linear-gradient(100deg,rgba(5,12,19,.94),rgba(16,25,34,.82));border-color:rgba(151,161,169,.8)}
.menu-btn:hover{transform:translateX(7px);box-shadow:0 0 30px rgba(91,242,221,.3),0 12px 35px rgba(0,0,0,.42)}
.menu-btn .sub{display:block;margin-left:46px;font:400 10px Arial,sans-serif;letter-spacing:3px;color:#cfe0df;margin-top:4px}
.icon{display:inline-flex;width:38px;justify-content:center;margin-right:8px;font-family:Arial,sans-serif}
.bottom{position:absolute;left:5.5%;bottom:5.5%;font-size:14px;letter-spacing:3px;text-shadow:0 2px 6px #111}
.bottom:before{content:"";display:inline-block;width:75px;height:1px;vertical-align:middle;margin-right:13px;background:#e8eeee}
.compass{position:absolute;right:4.4%;bottom:5.2%;width:95px;height:95px;border:1px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(5,15,22,.24);box-shadow:inset 0 0 26px rgba(255,255,255,.06)}
.compass:before{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.27);border-radius:50%}
.compass span{position:absolute;font:700 12px Arial,sans-serif}.n{top:2px;left:44px}.s{bottom:2px;left:45px}.e{right:2px;top:41px}.w{left:2px;top:41px}
.needle{position:absolute;left:44px;top:20px;width:7px;height:55px;background:linear-gradient(#f4b43f 0 50%,#e4eeee 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:rotate(28deg)}
.modal{display:none;position:absolute;z-index:50;inset:0;align-items:center;justify-content:center;background:rgba(0,0,0,.76);backdrop-filter:blur(7px)}
.panel{width:min(520px,86vw);padding:38px;border:1px solid #73919b;border-radius:14px;background:linear-gradient(145deg,#0b1c28,#08131d);box-shadow:0 25px 80px rgba(0,0,0,.8)}
.panel h2{margin:0 0 12px;color:#f5c96f;font-size:36px}.panel p{font:400 16px Arial,sans-serif;line-height:1.7;color:#cbd7dc;margin:0 0 22px}
.close{padding:12px 25px;border:1px solid #72919b;border-radius:7px;background:#122f39;color:#fff;cursor:pointer;font-size:16px}
@media(max-width:700px){.logo{left:5%;top:5%;font-size:52px}.topline{display:none}.controls{left:5%;top:42%;width:60vw}.menu-btn{height:66px;font-size:19px}.compass{display:none}.bottom{font-size:11px}}
</style>
</head>
<body>
<div class="menu">
<svg class="scene" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17486d"/><stop offset=".48" stop-color="#8ab7c8"/><stop offset=".72" stop-color="#efad69"/><stop offset="1" stop-color="#173f38"/></linearGradient>
  <radialGradient id="sun"><stop offset="0" stop-color="#fffbe0"/><stop offset=".18" stop-color="#ffe9ae"/><stop offset=".5" stop-color="#ffd383" stop-opacity=".58"/><stop offset="1" stop-color="#ffd383" stop-opacity="0"/></radialGradient>
  <linearGradient id="farMount" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#63859a"/><stop offset="1" stop-color="#31576d"/></linearGradient>
  <linearGradient id="mount" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#527487"/><stop offset="1" stop-color="#233f51"/></linearGradient>
  <linearGradient id="gold"><stop stop-color="#fff0a6"/><stop offset=".25" stop-color="#f6cb68"/><stop offset=".55" stop-color="#d99a28"/><stop offset="1" stop-color="#6b4211"/></linearGradient>
  <linearGradient id="lake" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5db7bd"/><stop offset=".45" stop-color="#287d91"/><stop offset="1" stop-color="#083f56"/></linearGradient>
  <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#46784e"/><stop offset=".45" stop-color="#234a38"/><stop offset="1" stop-color="#071d1a"/></linearGradient>
  <linearGradient id="castle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4c4744"/><stop offset=".45" stop-color="#8b7a6a"/><stop offset="1" stop-color="#433c38"/></linearGradient>
  <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1118"/><stop offset=".55" stop-color="#2f3942"/><stop offset="1" stop-color="#10171c"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".42"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <pattern id="waterLines" width="140" height="32" patternUnits="userSpaceOnUse"><path d="M0 17 Q35 9 70 17 T140 17" fill="none" stroke="#c7f2ee" stroke-opacity=".2" stroke-width="2"/></pattern>
</defs>

  <g transform="translate(1364 565) scale(1.55)"><rect x="30" y="80" width="12" height="55" fill="#39271d"/><circle cx="36" cy="56" r="41" fill="#2e6a40"/><circle cx="9" cy="72" r="25" fill="#3f7b48"/><circle cx="62" cy="73" r="29" fill="#245836"/></g>
</g>

<!-- foreground rocks -->
<g fill="#6a5c45">

  <path d="M1164 285 q18 -16 36 0 q18 -16 36 0"/>
  <path d="M1242 247 q12 -11 24 0 q12 -11 24 0"/>

</g>
</svg>

<div class="ui">
  <div class="logo">OPEN<span class="gold">WORLD</span><small>AN UNFORGETTABLE ADVENTURE</small></div>
  <div class="topline">EXPLORE &nbsp; • &nbsp; BUILD &nbsp; • &nbsp; SURVIVE</div>

  <div class="controls">
    <button class="menu-btn play" onclick="startGame()"><span class="icon">▶</span> PLAY<span class="sub">ENTER THE WORLD</span></button>
    <button class="menu-btn settings" onclick="openSettings()"><span class="icon">⚙</span> SETTINGS<span class="sub">CUSTOMIZE YOUR EXPERIENCE</span></button>
  </div>

  <div class="bottom">A VAST WORLD AWAITS...</div>
  <div class="compass"><span class="n">N</span><span class="s">S</span><span class="e">E</span><span class="w">W</span><div class="needle"></div></div>
</div>

<div class="modal" id="settings">
  <div class="panel">
    <h2>Settings</h2>
    <p>Your adventure settings will live here. More options can be added as the Open World game is built.</p>
    <button class="close" onclick="closeSettings()">CLOSE</button>
  </div>
</div>

<script>
function startGame(){alert("The Open World game will start here!")}
function openSettings(){document.getElementById("settings").style.display="flex"}
function closeSettings(){document.getElementById("settings").style.display="none"}
</script>
</body>
</html>
