<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#f4b84b;--cyan:#58e8e0;--glass:rgba(7,18,28,.68)}
body{overflow:hidden;font-family:Georgia,"Times New Roman",serif;background:#06131c;color:#fff}
.menu{width:100vw;height:100vh;position:relative;overflow:hidden;background:
radial-gradient(circle at 77% 29%,rgba(255,235,171,.95) 0 2.5%,rgba(255,184,91,.35) 7%,transparent 25%),
linear-gradient(180deg,#1e527a 0%,#5e9fbe 31%,#f0b16d 53%,#214c43 54%,#071c1c 100%)}
.menu:after{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.58) 100%),linear-gradient(180deg,rgba(0,0,0,.08),transparent 35%,rgba(0,0,0,.3))}
.sky{position:absolute;inset:0;z-index:1;overflow:hidden}
.sun{position:absolute;width:118px;height:118px;border-radius:50%;right:10%;top:23%;background:#fff6cf;box-shadow:0 0 35px #fff0ae,0 0 110px 45px rgba(255,205,116,.35)}
.cloud{position:absolute;width:260px;height:55px;border-radius:60px;background:rgba(255,255,255,.19);filter:blur(5px)}
.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud:before{width:105px;height:105px;left:42px;bottom:0}.cloud:after{width:135px;height:135px;right:38px;bottom:0}
.c1{top:12%;left:-300px;animation:drift 70s linear infinite}.c2{top:25%;left:-450px;transform:scale(.7);animation:drift 95s linear 12s infinite}.c3{top:8%;left:-500px;transform:scale(.45);animation:drift 110s linear 25s infinite}
@keyframes drift{to{left:115%}}
.mountain{position:absolute;z-index:4;bottom:31%;width:0;height:0;border-left:270px solid transparent;border-right:270px solid transparent;border-bottom:375px solid #345a6d;filter:drop-shadow(0 14px 10px rgba(0,0,0,.25))}
.m1{left:27%;bottom:32%}.m2{left:2%;bottom:30%;border-bottom-color:#294858;transform:scale(.78)}.m3{left:52%;bottom:33%;border-bottom-color:#416879;transform:scale(.72)}
.m4{left:70%;bottom:32%;border-bottom-color:#294b59;transform:scale(.55)}
.snow{position:absolute;z-index:5;left:calc(27% + 205px);bottom:calc(32% + 285px);width:0;height:0;border-left:58px solid transparent;border-right:58px solid transparent;border-bottom:88px solid #e9f4f3;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
.mountain-line{position:absolute;z-index:6;left:0;right:0;bottom:29%;height:90px;background:linear-gradient(175deg,transparent 0 25%,#183b36 26% 100%);clip-path:polygon(0 62%,8% 35%,16% 57%,26% 20%,35% 55%,46% 26%,55% 58%,66% 18%,76% 51%,86% 23%,100% 55%,100% 100%,0 100%)}
.land{position:absolute;z-index:8;left:-6%;right:-6%;bottom:-10%;height:48%;border-radius:50% 50% 0 0;background:
radial-gradient(ellipse at 18% 25%,#39734d 0 7%,transparent 8%),
radial-gradient(ellipse at 64% 20%,#315f43 0 9%,transparent 10%),
linear-gradient(165deg,#315d3d,#173a2e 57%,#081b19);transform:rotate(-2deg);box-shadow:inset 0 20px 35px rgba(0,0,0,.18)}
.water{position:absolute;z-index:7;right:-5%;bottom:7%;width:49%;height:31%;border-radius:55% 45% 0 45%;background:
repeating-linear-gradient(172deg,rgba(255,255,255,.16) 0 2px,transparent 2px 15px),
linear-gradient(145deg,#49a9b1,#176a82 50%,#0a4058);transform:rotate(-7deg);opacity:.92;box-shadow:inset 0 12px 30px rgba(115,230,232,.2)}
.river{position:absolute;z-index:9;left:43%;bottom:0;width:13%;height:48%;background:linear-gradient(90deg,transparent,#2d8d91aa,#63c9c4aa,transparent);clip-path:polygon(38% 0,64% 0,100% 100%,0 100%);filter:blur(2px)}
.city{position:absolute;z-index:11;right:18%;bottom:30%;width:270px;height:165px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
.building{position:absolute;bottom:0;background:linear-gradient(90deg,#403d3a,#76675a,#443d37);border-radius:3px 3px 0 0;box-shadow:inset 5px 0 rgba(255,205,130,.1)}
.b1{left:0;width:35px;height:55px}.b2{left:43px;width:42px;height:78px}.b3{left:95px;width:36px;height:62px}.b4{left:158px;width:46px;height:92px}.b5{left:215px;width:38px;height:56px}
.building:after{content:"";position:absolute;inset:10px 7px;background:repeating-linear-gradient(90deg,#e6b75c 0 5px,transparent 5px 15px),repeating-linear-gradient(0deg,#e6b75c 0 5px,transparent 5px 17px);opacity:.55}
.tower{position:absolute;bottom:0;left:117px;width:39px;height:145px;background:linear-gradient(90deg,#514a44,#807267,#49433d)}
.tower:before{content:"";position:absolute;top:-42px;left:-15px;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:46px solid #49423c}
.tower:after{content:"";position:absolute;top:34px;left:13px;width:12px;height:17px;background:#f5ca6b;box-shadow:0 35px #f5ca6b,0 70px #f5ca6b}
.bridge{position:absolute;z-index:12;right:27%;bottom:18%;width:210px;height:16px;border-radius:50%;background:#674d36;transform:rotate(-7deg);box-shadow:0 8px 0 rgba(0,0,0,.25)}
.tree{position:absolute;z-index:14;width:38px;height:115px}
.tree:before{content:"";position:absolute;bottom:0;left:15px;width:9px;height:50px;background:#352a20}
.tree:after{content:"";position:absolute;left:-13px;top:0;width:66px;height:78px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#467f4e,#1b4a35 70%);box-shadow:18px 22px 0 -7px #26583c,-15px 30px 0 -10px #356a42}
.t1{left:7%;bottom:22%;transform:scale(1.3)}.t2{left:18%;bottom:28%;transform:scale(.85)}.t3{left:40%;bottom:20%;transform:scale(1.15)}.t4{right:7%;bottom:24%;transform:scale(1.25)}.t5{right:35%;bottom:18%;transform:scale(.72)}
.hero{position:absolute;z-index:18;left:34%;bottom:10%;width:75px;height:175px;filter:drop-shadow(0 12px 8px rgba(0,0,0,.55))}
.hero .cape{position:absolute;top:47px;left:-8px;width:65px;height:95px;background:linear-gradient(115deg,#0c1218,#27313a);clip-path:polygon(20% 0,80% 0,100% 100%,45% 80%,0 100%);transform:rotate(-4deg)}
.hero .head{position:absolute;top:2px;left:22px;width:31px;height:31px;border-radius:50%;background:linear-gradient(135deg,#34251d,#171312)}
.hero .hood{position:absolute;top:-5px;left:13px;width:49px;height:43px;border-radius:55% 55% 35% 35%;background:#12191e;z-index:-1}
.hero .body{position:absolute;top:31px;left:15px;width:45px;height:73px;border-radius:12px 12px 5px 5px;background:linear-gradient(90deg,#11181d,#34404a,#12181d);border:1px solid #59616a}
.hero .leg1,.hero .leg2{position:absolute;top:98px;width:18px;height:67px;background:#12171b;border-radius:6px}.hero .leg1{left:16px;transform:rotate(7deg)}.hero .leg2{left:40px;transform:rotate(-7deg)}
.hero .sword{position:absolute;top:30px;right:-16px;width:7px;height:91px;background:linear-gradient(90deg,#bfc9ca,#fff,#7f8d8f);transform:rotate(25deg);border-radius:4px;box-shadow:0 0 5px #fff}
.hero .sword:after{content:"";position:absolute;bottom:-7px;left:-7px;width:21px;height:7px;background:#9b7038}
.firefly{position:absolute;z-index:16;width:4px;height:4px;border-radius:50%;background:#fff2a1;box-shadow:0 0 12px 4px #ffe37a;animation:float 4s ease-in-out infinite}
.f1{left:23%;bottom:29%}.f2{left:31%;bottom:19%;animation-delay:1s}.f3{left:45%;bottom:27%;animation-delay:2s}.f4{right:31%;bottom:22%;animation-delay:.5s}
@keyframes float{50%{transform:translate(12px,-18px);opacity:.35}}
.logo{position:absolute;z-index:40;top:6%;left:5.5%;font-weight:900;font-size:clamp(52px,6.2vw,106px);line-height:.72;letter-spacing:-5px;text-shadow:5px 7px 0 #18222a,0 12px 35px rgba(0,0,0,.7)}
.logo small{display:block;font-size:.18em;letter-spacing:8px;line-height:1;margin:13px 0 0 9px;color:#d9e4e4;text-shadow:2px 2px #101820}
.logo span{display:block;color:var(--gold);text-shadow:5px 7px 0 #493012,0 10px 28px rgba(0,0,0,.65)}
.tagline{position:absolute;z-index:40;top:5%;right:5%;font-size:clamp(13px,1.35vw,21px);letter-spacing:4px;color:#f8eee0;text-shadow:0 2px 8px #111}.tagline:after{content:"";display:block;margin-top:12px;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent)}
.buttons{position:absolute;z-index:45;left:5.5%;top:43%;width:min(410px,33vw)}
button{width:100%;height:76px;margin-bottom:16px;border:1px solid #71808b;border-radius:7px;color:white;font-family:Georgia,"Times New Roman",serif;font-size:25px;font-weight:bold;letter-spacing:2px;text-align:left;padding:0 30px;cursor:pointer;background:linear-gradient(110deg,rgba(5,16,25,.94),rgba(16,35,47,.72));box-shadow:0 12px 28px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.12);transition:.25s}
button:hover{transform:translateX(10px);border-color:#a7f9ee;box-shadow:0 0 24px rgba(88,232,224,.25),0 12px 28px rgba(0,0,0,.45)}
.play{background:linear-gradient(110deg,#075c49,#087e68,#123f3c);border-color:var(--cyan);box-shadow:0 0 26px rgba(88,232,224,.25),0 12px 28px rgba(0,0,0,.4)}
.icon{display:inline-flex;width:36px;justify-content:center;margin-right:12px;color:#d9fff8}
.sub{display:block;font-family:Arial,sans-serif;font-size:10px;letter-spacing:2px;color:#b9cbd0;margin:3px 0 0 50px;font-weight:normal}
.bottom-info{position:absolute;z-index:40;left:5.5%;bottom:5%;font-size:13px;letter-spacing:3px;color:#d9e3df;text-shadow:0 2px 5px #111}
.bottom-info:before{content:"";display:inline-block;width:75px;height:1px;background:#d9e3df;vertical-align:middle;margin-right:12px}
.compass{position:absolute;z-index:40;right:4%;bottom:5%;width:92px;height:92px;border:1px solid rgba(255,255,255,.45);border-radius:50%;background:rgba(5,15,21,.3);box-shadow:inset 0 0 20px rgba(255,255,255,.06)}
.compass:before{content:"";position:absolute;inset:9px;border:1px solid rgba(255,255,255,.25);border-radius:50%}
.compass:after{content:"N";position:absolute;top:2px;left:41px;font:bold 12px Arial;color:#fff}
.needle{position:absolute;left:43px;top:18px;width:6px;height:57px;background:linear-gradient(#f4b84b 0 50%,#d9e4e4 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:rotate(28deg)}
.modal{display:none;position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);align-items:center;justify-content:center}
.panel{width:min(520px,86vw);padding:38px;border:1px solid #6f939c;border-radius:14px;background:linear-gradient(145deg,#0b1c28,#08131d);box-shadow:0 25px 80px rgba(0,0,0,.8)}
.panel h2{font-size:36px;margin-bottom:12px;color:#f5c86b}.panel p{font-family:Arial,sans-serif;color:#c8d4dc;line-height:1.7;margin-bottom:24px}.close{width:auto;padding:0 28px;height:50px;margin:0;font-size:17px}
@media(max-width:700px){.logo{top:4%;left:5%;font-size:52px}.tagline{display:none}.buttons{left:5%;top:39%;width:58vw}.buttons button{height:63px;font-size:19px}.hero{left:48%;transform:scale(.75)}.city{right:2%;transform:scale(.7);transform-origin:bottom right}.compass{display:none}}
</style>
</head>
<body>
<div class="menu">
  <div class="sky"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
  <div class="mountain m1"></div><div class="mountain m2"></div><div class="mountain m3"></div><div class="mountain m4"></div><div class="snow"></div>
  <div class="mountain-line"></div><div class="water"></div><div class="river"></div>
  <div class="city"><div class="building b1"></div><div class="building b2"></div><div class="building b3"></div><div class="tower"></div><div class="building b4"></div><div class="building b5"></div></div>
  <div class="bridge"></div>
  <div class="land"></div>
  <div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="tree t5"></div>
  <div class="firefly f1"></div><div class="firefly f2"></div><div class="firefly f3"></div><div class="firefly f4"></div>
  <div class="hero"><div class="hood"></div><div class="head"></div><div class="body"></div><div class="cape"></div><div class="leg1"></div><div class="leg2"></div><div class="sword"></div></div>

  <div class="logo">OPEN<span>WORLD</span><small>AN UNFORGETTABLE ADVENTURE</small></div>
  <div class="tagline">EXPLORE &nbsp; • &nbsp; BUILD &nbsp; • &nbsp; SURVIVE</div>

  <div class="buttons">
    <button class="play" onclick="startGame()"><span class="icon">▶</span> PLAY<div class="sub">ENTER THE WORLD</div></button>
    <button onclick="openSettings()"><span class="icon">⚙</span> SETTINGS<div class="sub">CUSTOMIZE YOUR EXPERIENCE</div></button>
  </div>

  <div class="bottom-info">A VAST WORLD AWAITS...</div>
  <div class="compass"><div class="needle"></div></div>

  <div class="modal" id="settings">
    <div class="panel">
      <h2>Settings</h2>
      <p>Your adventure settings will live here. More options can be added as the game grows.</p>
      <button class="close" onclick="closeSettings()">CLOSE</button>
    </div>
  </div>
</div>
<script>
function startGame(){alert("The Open World game will start here!")}
function openSettings(){document.getElementById("settings").style.display="flex"}
function closeSettings(){document.getElementById("settings").style.display="none"}
</script>
</body>
</html>
